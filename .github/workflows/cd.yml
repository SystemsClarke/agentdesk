# Every merge to main becomes a signed GitHub Release. Installed copies check the releases every four hours
# (Setup.KeepUpdated) and offer "Restart to update" in the tray, so nobody installs anything by hand.
#
# Signing uses the AgentDesk cert IT allow-listed (thumbprint AE6661701A6D11E50423B66216D26410489953BD).
# John adds it once as two repository secrets:
#   AGENTDESK_SIGN_PFX       the exported .pfx, base64-encoded
#   AGENTDESK_SIGN_PASSWORD  its export password
# Without them this workflow fails rather than publish an unsigned build that Comodo would quarantine.
name: cd
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the version is 0.1.<commit count>
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Signing cert
        shell: pwsh
        env:
          PFX: ${{ secrets.AGENTDESK_SIGN_PFX }}
        run: |
          if (-not $env:PFX) { throw 'The AGENTDESK_SIGN_PFX secret is not set; see the header of cd.yml.' }
          $path = Join-Path $env:RUNNER_TEMP 'agentdesk.pfx'
          [IO.File]::WriteAllBytes($path, [Convert]::FromBase64String($env:PFX))
          "AGENTDESK_SIGN_PFX=$path" >> $env:GITHUB_ENV
          "VERSION=0.1.$(git rev-list --count HEAD)" >> $env:GITHUB_ENV

      - name: Build and test
        shell: pwsh
        run: ./build.ps1 -Test

      - name: Previous release (for the delta package)
        shell: pwsh
        continue-on-error: true # the first release has nothing to diff against
        run: |
          dotnet tool restore
          dotnet vpk download github --repoUrl https://github.com/${{ github.repository }} --outputDir releases

      - name: Package and sign
        shell: pwsh
        env:
          AGENTDESK_SIGN_PASSWORD: ${{ secrets.AGENTDESK_SIGN_PASSWORD }}
        run: ./build.ps1 -Package

      - name: Publish the release
        shell: pwsh
        run: >
          dotnet vpk upload github --repoUrl https://github.com/${{ github.repository }}
          --token ${{ secrets.GITHUB_TOKEN }} --outputDir releases --publish
          --releaseName "AgentDesk ${{ env.VERSION }}" --tag "v${{ env.VERSION }}"

      - name: Remove the cert
        if: always()
        shell: pwsh
        run: Remove-Item (Join-Path $env:RUNNER_TEMP 'agentdesk.pfx') -ErrorAction Ignore
