name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked
      - name: Build
        run: cargo build --release --locked
      - name: Feature parity with the .NET build
        shell: bash
        run: |
          PY=python3; command -v python3 >/dev/null || PY=python
          # numpy is the vault search's only dependency; a distribution Python (Ubuntu 24.04) refuses a plain pip install
          $PY -m pip install numpy >/dev/null 2>&1 || $PY -m pip install --break-system-packages numpy >/dev/null 2>&1 || true
          $PY -c "import numpy; print('numpy', numpy.__version__)" || echo "numpy is missing: vault.search and dictation will fail"
          $PY parity/coverage.py
          # Linux enforces the ratchet (nothing that passed may stop passing); macOS and Windows report, so a
          # platform quirk in a check is visible in the artifact without blocking, until the checks are proven there.
          if [ "$RUNNER_OS" = "Linux" ]; then $PY parity/run.py --json parity-report.json; else $PY parity/run.py --no-ratchet --json parity-report.json; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: parity-report-${{ matrix.os }}
          path: parity-report.json
          if-no-files-found: ignore
      - name: Smoke test the MCP server
        shell: bash
        run: |
          export AGENTDESK_DATA="$RUNNER_TEMP/agentdesk-smoke"
          out=$(printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}' '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' | ./target/release/agentdesk mcp)
          echo "$out" | grep -q '"post_message"'
